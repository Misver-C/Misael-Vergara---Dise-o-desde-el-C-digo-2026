<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misael Vergara - Landing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="splash-screen" class="splash-screen"></div>

    <!-- Header / Barra de navegación -->
    <header class="header">
        <nav class="nav-buttons">
            <a href="index.html" class="nav-btn">Inicio</a>
            <a href="encargos.html" class="nav-btn">Encargos</a>
            <a href="proyectos.html" class="nav-btn">Proyectos</a>
            <a href="https://wiki.ead.pucv.cl/Misael_Vergara" class="nav-btn" target="_blank" rel="noopener noreferrer">Wiki</a>
        </nav>
    </header>

    <!-- Sección principal / Hero con parallax y blur en imagen de fondo -->
    <main class="main-section">
        <!-- Imagen de fondo que cubre todo el ancho y alto -->
        <img class="hero-bg-img" src="assets/fondo.jpg" alt="Fondo" onerror="this.style.display='none'">
        
        <!-- Capa de superposición para contraste -->
        <div class="hero-overlay"></div>

        <!-- Contenido principal situado sobre el fondo -->
        <div class="hero-content">
            <img class="hero-gif" src="assets/gif.gif" alt="Logo" onerror="this.style.display='none'">
            <div class="text-container">
                <h2>Misael Vergara</h2>
                <p>
                    Soy un estudiante de Diseño en la Escuela de Arquitectura y Diseño de la PUCV. Actualmente estoy cursando mi cuarto año de carrera.
                </p>
            </div>
        </div>
    </main>


    <section class="content-section">
        <div class="content-container">
            <h3>Intereses personales</h3>
            <p>
                Me apasiona el mundo de la ilustración digital y el diseño .
            </p>
        </div>
    </section>

    <script type="module" src="script.js"></script>
</body>
</html>
